default_profile: esp32s3_imu_test

profiles:
  esp32s3_imu_test:
    notes: ESP32-S3 Adafruit STEMMA QT MPU-6050 motion and Shake test.
    fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit MPU6050 (2.2.9)
      - dependency: Adafruit BusIO (1.17.4)
      - dependency: Adafruit Unified Sensor (1.1.15)
