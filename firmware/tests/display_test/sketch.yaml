default_profile: esp32s3_display_test

profiles:
  esp32s3_display_test:
    notes: ESP32-S3 target for TFT and microSD bring-up; PSRAM is not required.
    fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit HX8357 Library (1.1.20)
      - Adafruit GFX Library (1.13.0)
      - Adafruit ImageReader Library (2.10.0)
      - dependency: Adafruit BusIO (1.17.4)
      - dependency: Adafruit SPIFlash (5.1.1)
      - dependency: Adafruit EPD (4.6.14)
      - dependency: SdFat - Adafruit Fork (2.3.103)
