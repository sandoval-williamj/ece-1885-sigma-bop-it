default_profile: esp32s3_embedded

profiles:
  esp32s3_embedded:
    notes: ESP32-S3 game with flash-resident images and voice prompts.
    fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=huge_app,PSRAM=disabled
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit HX8357 Library (1.1.20)
      - Adafruit GFX Library (1.13.0)
      - Adafruit MPU6050 (2.2.9)
      - ESP32Encoder (5.0.0)
      - ESP8266Audio (2.4.1)
      - dependency: Adafruit BusIO (1.17.4)
      - dependency: Adafruit Unified Sensor (1.1.15)

